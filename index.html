<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><link rel="manifest" href="manifest.webmanifest"><title>ObraCerta</title><style>
:root{--blue:#2563eb;--ink:#172033;--muted:#64748b;--line:#e5e7eb;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Arial;color:var(--ink)}.app{max-width:520px;min-height:100dvh;margin:auto;background:white;box-shadow:0 0 25px #0001}header{background:var(--ink);color:white;padding:16px;position:sticky;top:0}.brand{font-weight:800;font-size:21px}.switch{display:flex;gap:8px;margin-top:12px}.switch button{flex:1;padding:10px;border:0;border-radius:9px;background:#334155;color:white}.switch .active{background:var(--blue)}main{padding:18px 16px 90px}.muted{color:var(--muted);font-size:13px}.title{font-size:25px;font-weight:800;margin:8px 0}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--blue);color:white;font-weight:750;margin-top:10px}.btn.alt{background:#eff6ff;color:#1d4ed8}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.card{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{border:0;background:var(--bg);border-radius:12px;padding:16px 5px;font-weight:700}.cat b{display:block;font-size:23px;margin-bottom:6px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.item{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid var(--line)}.item .info{flex:1}.pill{font-size:10px;background:#eff6ff;color:#1d4ed8;border-radius:20px;padding:5px 8px;font-weight:800}.green{background:#dcfce7;color:#166534}.amber{background:#fef3c7;color:#92400e}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 2px max(10px,env(safe-area-inset-bottom))}nav button{border:0;background:white;color:var(--muted);font-size:10px}nav button.active{color:var(--blue);font-weight:800}nav span{display:block;font-size:20px;margin-bottom:3px}.back{border:0;background:none;color:var(--blue);font-weight:700;padding:0;margin-bottom:12px}.price{font-size:23px;color:var(--blue);font-weight:850}
</style></head><body><div class="app"><header><div class="brand">▦ ObraCerta <small style="float:right;font-size:10px;color:#cbd5e1;font-weight:400">CAMPO GRANDE/MS</small></div><div class="switch"><button id="c" class="active" onclick="mode='c';page='home';render()">Sou cliente</button><button id="s" onclick="mode='s';page='dashboard';render()">Sou fornecedor</button></div></header><main id="main"></main><nav id="nav"></nav></div><script>
const P=[['Cimento CP II 50kg','saco',39.9,'Básicos'],['Tijolo cerâmico 8 furos','unidade',1.15,'Alvenaria'],['Areia média','m³',180,'Básicos'],['Brita 1','m³',165,'Básicos'],['Argamassa AC-II 20kg','saco',28.9,'Acabamento'],['Fio elétrico 2,5mm','rolo',145,'Elétrica'],['Tinta acrílica 18L','lata',239,'Acabamento'],['Bloco de concreto','unidade',3.5,'Alvenaria']];
let mode='c',page='home',cart=JSON.parse(localStorage.cart||'[]'),sent=false,search='',chosen=['Depósito Central','Materiais São José','ConstruLar'],responded=false;
const money=n=>'R$ '+Number(n).toFixed(2).replace('.',',');function save(){localStorage.cart=JSON.stringify(cart)}
function go(p){page=p;render()}function add(i){let x=cart.find(a=>a.id===i);if(x)x.q++;else cart.push({id:i,n:P[i][0],u:P[i][1],q:1,price:P[i][2]});save();render()}
function nav(items){navEl.innerHTML=items.map(([p,ic,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${ic}</span>${t}</button>`).join('')}
const main=document.getElementById('main'),navEl=document.getElementById('nav');
function render(){document.getElementById('c').classList.toggle('active',mode==='c');document.getElementById('s').classList.toggle('active',mode==='s');
if(mode==='c'){nav([['home','⌂','Início'],['catalog','⌕','Buscar'],['cart','▣','Lista'],['quotes','▤','Cotações'],['profile','●','Perfil']]);client()}else{nav([['dashboard','▦','Painel'],['orders','▣','Pedidos'],['proposals','▤','Propostas'],['plan','◇','Plano'],['store','▤','Loja']]);supplier()}}
function client(){if(page==='home')main.innerHTML=`<div class="muted">BEM-VINDA · CAMPO GRANDE/MS</div><div class="title">O que vamos construir?</div><p class="muted">Encontre materiais e compare preços na sua região.</p><input class="input" placeholder="Buscar cimento, tijolo, areia..." oninput="search=this.value;go('catalog')"><h3>Categorias</h3><div class="grid">${[['Básicos','▤'],['Alvenaria','▦'],['Elétrica','ϟ'],['Hidráulica','◯'],['Acabamento','▣'],['Ferramentas','⚒']].map(x=>`<button class="cat" onclick="search='${x[0]}';go('catalog')"><b>${x[1]}</b>${x[0]}</button>`).join('')}</div><div class="card"><b>Sua lista de materiais</b><p class="muted">${cart.length} tipos de materiais adicionados</p><button class="btn" onclick="go('cart')">Ver minha lista</button></div><p class="muted">Monte uma lista e envie uma única solicitação para vários depósitos.</p>`;
if(page==='catalog'){let a=P.map((p,i)=>({p,i})).filter(x=>!search||x.p[0].toLowerCase().includes(search.toLowerCase())||x.p[3]===search);main.innerHTML=`<button class="back" onclick="search='';go('home')">← Voltar</button><div class="title">Materiais</div><input class="input" placeholder="Pesquisar..." value="${search}" oninput="search=this.value;render()">${a.map(x=>`<div class="item"><div class="info"><b>${x.p[0]}</b><div class="muted">${x.p[1]} · referência ${money(x.p[2])}</div></div><button class="btn" style="width:auto;margin:0" onclick="add(${x.i})">Adicionar</button></div>`).join('')}`}
if(page==='cart')main.innerHTML=`<button class="back" onclick="go('catalog')">← Adicionar materiais</button><div class="title">Minha lista</div>${cart.map(x=>`<div class="item"><div class="info"><b>${x.n}</b><div class="muted">${x.u}</div></div><button onclick="xqty(${x.id},-1)">−</button><b>${x.q}</b><button onclick="xqty(${x.id},1)">+</button><button onclick="cart=cart.filter(a=>a.id!==${x.id});save();render()">×</button></div>`).join('')||'<p class="muted">Sua lista está vazia.</p>'}<button class="btn" ${cart.length?'':'disabled'} onclick="go('distribution')">Continuar para cotação</button>`;
if(page==='distribution')main.innerHTML=`<button class="back" onclick="go('cart')">← Voltar</button><div class="title">Enviar cotação</div><label class="muted">Endereço de entrega</label><input class="input" placeholder="CEP ou endereço"><h3>Escolha os depósitos</h3>${['Depósito Central','Materiais São José','ConstruLar'].map(x=>`<div class="card"><label><input type="checkbox" ${chosen.includes(x)?'checked':''} onchange="this.checked?chosen.push('${x}'):chosen=chosen.filter(y=>y!=='${x}')"> ${x}</label></div>`).join('')}<button class="btn alt" onclick="chosen=['Todos os fornecedores compatíveis'];go('review')">Enviar automaticamente aos compatíveis</button><button class="btn" onclick="go('review')">Continuar com seleção (${chosen.length})</button>`;
if(page==='review')main.innerHTML=`<button class="back" onclick="go('distribution')">← Voltar</button><div class="title">Revisar solicitação</div><div class="card"><b>${cart.length} tipos de materiais</b><p class="muted">${cart.map(x=>x.q+' '+x.u+' de '+x.n).join('<br>')}</p><b>Destinatários</b><p class="muted">${chosen.join(', ')}</p></div><button class="btn" onclick="sent=true;go('quotes')">Confirmar envio da cotação</button>`;
if(page==='quotes')main.innerHTML=`<div class="title">Minhas cotações</div>${sent?`<div class="card"><div class="row"><b>Cotação #1025</b><span class="pill green">Enviada</span></div><p class="muted">Campo Grande/MS · ${cart.length} itens</p><p class="muted">Depósito Central — proposta recebida<br>Materiais São José — aguardando<br>ConstruLar — aguardando</p><button class="btn" onclick="go('compare')">Comparar propostas</button></div>`:'<p class="muted">Você ainda não enviou cotações.</p>'}`;
if(page==='compare')main.innerHTML=`<button class="back" onclick="go('quotes')">← Voltar</button><div class="title">Comparar propostas</div><p class="muted">Valores fictícios para demonstração.</p>${[['Depósito Central',855,35,'100%'],['Materiais São José',790,70,'80%'],['ConstruLar',900,0,'100%']].map(x=>`<div class="card"><b>${x[0]}</b><div class="price">${money(x[1]+x[2])}</div><p class="muted">Materiais: ${money(x[1])}<br>Frete: ${money(x[2])}<br>Itens atendidos: ${x[3]}</p><button class="btn alt" onclick="alert('Contato ilustrativo. Na versão real, abrirá o WhatsApp ou telefone cadastrado.')">Ver contato</button></div>`).join('')}`;
if(page==='profile')main.innerHTML='<div class="title">Meu perfil</div><div class="card"><b>Cliente demonstrativo</b><p class="muted">Campo Grande/MS · Conta gratuita</p></div>'}
function xqty(id,d){cart=cart.map(x=>x.id===id?{...x,q:Math.max(1,x.q+d)}:x);save();render()}
function supplier(){if(['dashboard','orders'].includes(page))main.innerHTML=`<div class="muted">AMBIENTE DO FORNECEDOR</div><div class="title">Painel da loja</div><p class="muted">Depósito Central · Campo Grande/MS</p><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card">Solicitações<h2>12</h2></div><div class="card">Aguardando<h2>5</h2></div></div><h3>Solicitações recentes</h3><div class="card"><div class="row"><b>Cotação #1025</b><span class="pill amber">Pendente</span></div><p class="muted">Cliente · 8 materiais · Hoje</p><button class="btn" onclick="go('respond')">Analisar solicitação</button></div><div class="card"><b>Cotação #1024</b><p class="muted">12 materiais · Respondida</p></div>`;
if(page==='respond')main.innerHTML=`<button class="back" onclick="go('orders')">← Voltar</button><div class="title">Responder cotação</div><div class="card"><b>Solicitação #1025</b><p class="muted">Cimento 10 sacos<br>Tijolo 500 unidades<br>Areia 2 m³</p></div><label class="muted">Preço unitário do cimento (R$)</label><input class="input" value="39,90"><label class="muted">Frete (R$)</label><input class="input" value="35,00"><label class="muted">Prazo de entrega</label><select class="input"><option>1 dia</option><option selected>2 dias</option><option>3 dias</option><option>Retirada na loja</option></select><button class="btn" onclick="responded=true;go('proposals')">Enviar proposta</button>`;
if(page==='proposals')main.innerHTML=`<div class="title">Propostas</div>${responded?'<div class="card"><span class="pill green">Enviada</span><p>Cotação #1025</p><p class="muted">Proposta registrada nesta demonstração.</p></div>':'<p class="muted">Suas propostas aparecerão aqui.</p>'}`;
if(page==='plan')main.innerHTML='<div class="title">Plano da loja</div><div class="card"><span class="pill green">Plano demonstrativo</span><h2>Fornecedor Pro</h2><div class="price">R$ 99,90/mês</div><p class="muted">Preço ilustrativo. Assinatura real ainda não está integrada.</p><button class="btn" onclick="alert(\'Integração de pagamento será implementada depois.\')">Conhecer plano</button></div>';
if(page==='store')main.innerHTML='<div class="title">Minha loja</div><div class="card"><b>Depósito Central</b><p class="muted">Campo Grande/MS</p><button class="btn alt" onclick="alert(\'Cadastro demonstrativo.\')">Editar dados</button></div>'}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></main></div></body></html>
